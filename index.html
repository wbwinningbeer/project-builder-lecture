<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Animal Face Test & Lotto Generator</title>
    <meta name="google-adsense-account" content="ca-pub-1922136929973589">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1922136929973589"
     crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Teachable Machine Library -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body>
    <button id="theme-toggle" class="theme-toggle">Dark Mode</button>
    <div class="main-wrapper">
        <div class="container">
            <h1>AI Animal Face Test</h1>
            <p>Upload a photo to see if you look more like a Dog or a Cat!</p>
            
            <div id="upload-area" class="upload-area">
                <input type="file" id="image-input" accept="image/*" hidden>
                <button id="upload-btn" class="secondary-btn">Upload Image</button>
                <div id="image-preview" class="image-preview"></div>
            </div>

            <div id="loader" class="loader" style="display: none;">Analyzing...</div>
            <div id="result-container" class="result-container" style="display: none;">
                <h3 id="result-label"></h3>
                <div id="label-container"></div>
            </div>
        </div>

        <div class="container">
            <h1>Lotto Number Generator</h1>
            <button id="generate">Generate Numbers</button>
            <div id="numbers"></div>
        </div>

        <div class="container contact-container">
            <h2>Partnership Inquiry</h2>
            <form action="https://formspree.io/f/xqejardn" method="POST">
                <div class="form-group">
                    <input type="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="Inquiry Details" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>

        <div class="container comment-container">
            <div id="disqus_thread"></div>
            <script>
                (function() {
                var d = document, s = d.createElement('script');
                s.src = 'https://productbuilder-zjn8djoiia.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
